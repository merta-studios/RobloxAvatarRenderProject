name: Auto-Merge (Arbeitsbranch -> main)

# Zweck: Jeder Push auf einen Arbeitsbranch (z. B. `agent-changes` oder
# `arena/<session-id>-robloxavatarrenderproject`) landet automatisch in `main`
# - ohne Pull Request.
#
# Regeln:
#   * Gemerged wird immer genau der Branch, auf den gepusht wurde
#     (`github.ref_name`) - nicht ein fest verdrahteter Branch.
#   * `main` und `renders` sind nie Quelle (kein Selbst-Merge, keine Schleife).
#   * Es wird NIE ein Pull Request erstellt oder gemerged. Scheitert der
#     direkte Push (Branch-Schutz, fehlende Rechte), wird ein Issue erstellt
#     und der Lauf schlaegt fehl - `main` bleibt dann unveraendert.
#   * Merge-Konflikt: Merge wird abgebrochen (`main` bleibt unveraendert) und
#     ein Issue mit Lauf-URL erstellt.
#
# Optional: Secret AUTO_MERGE_TOKEN (Fine-grained PAT, Contents: Read and write,
# bei Branch-Schutz zusaetzlich als Bypass eingetragen). Noetig, wenn `main`
# geschuetzt ist oder wenn nach dem Merge weitere Workflows (z. B. der
# Avatar-Render) automatisch starten sollen - Pushes mit dem Standard-
# GITHUB_TOKEN loesen keine neuen Workflow-Laeufe aus.

on:
  push:
    branches:
      - "**"
      - "!main"      # main ist das Ziel - kein Merge von main nach main
      - "!renders"   # wird vom Render-Workflow geschrieben
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Quell-Branch (leer = Branch, auf dem der Workflow gestartet wird)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false   # Merges nie abbrechen, sonst bleibt der Zustand unklar

env:
  TARGET_BRANCH: main
  # Push-Event: der Branch, auf den gepusht wurde.
  # Workflow-Dispatch: Eingabe, sonst der im UI gewaehlte Branch.
  SOURCE_BRANCH: ${{ github.event.inputs.source_branch || github.ref_name }}
  # Optional: eigenes Token (Secret AUTO_MERGE_TOKEN) mit Repo-Rechten.
  MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}

jobs:
  auto-merge:
    name: Merge nach main
    # main selbst nie als Quelle; Dispatch auf main nur mit explizitem Quell-Branch.
    if: >-
      github.ref_name != 'renders' &&
      (github.event_name == 'workflow_dispatch' || github.ref_name != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1) Quell- und Ziel-Branch prüfen
        id: guard
        run: |
          set -euo pipefail
          echo "Quelle: $SOURCE_BRANCH"
          echo "Ziel:   $TARGET_BRANCH"
          if [ "$SOURCE_BRANCH" = "$TARGET_BRANCH" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Quell- und Ziel-Branch sind identisch ($SOURCE_BRANCH) - nichts zu tun."
            echo "### Kein Merge nötig" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$SOURCE_BRANCH\` ist der Ziel-Branch selbst." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 2) Repository auschecken (main)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ env.MERGE_TOKEN }}
          persist-credentials: true

      - name: 3) Git-User konfigurieren
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 4) Quell-Branch fetchen
        if: steps.guard.outputs.skip != 'true'
        id: fetch
        run: |
          set -uo pipefail
          if git fetch --no-tags origin \
               "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Quell-Branch HEAD: $(git rev-parse --short "origin/${SOURCE_BRANCH}")"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch '$SOURCE_BRANCH' existiert nicht (mehr) auf origin - nichts zu mergen."
            echo "### Kein Merge nötig" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch \`$SOURCE_BRANCH\` existiert nicht (mehr) auf origin." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 5) Prüfen, ob es etwas zu mergen gibt
        if: steps.fetch.outputs.exists == 'true'
        id: check
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "origin/${SOURCE_BRANCH}" HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            echo "### Kein Merge nötig" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$SOURCE_BRANCH\` ist bereits vollständig in \`$TARGET_BRANCH\` enthalten." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needs_merge=true" >> "$GITHUB_OUTPUT"
            echo "### Merge wird vorbereitet" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git log --oneline "HEAD..origin/$SOURCE_BRANCH" | head -n 20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 6) Quell-Branch in main mergen
        if: steps.check.outputs.needs_merge == 'true'
        id: merge
        run: |
          set -uo pipefail
          if git merge --no-ff --no-edit -m \
              "Auto-Merge: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}" "origin/${SOURCE_BRANCH}"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "### Merge erfolgreich" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git log -1 --pretty='%h %s' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Merge-Konflikt"
              echo ""
              echo "\`$SOURCE_BRANCH\` konnte nicht automatisch in \`$TARGET_BRANCH\` gemerged werden."
              echo "Der Merge wurde abgebrochen, \`$TARGET_BRANCH\` ist unverändert."
              echo "Es wurde **kein** Pull Request erstellt."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Merge-Konflikt zwischen $SOURCE_BRANCH und $TARGET_BRANCH"
            exit 1
          fi

      - name: 7) Nach main pushen (bei parallelen Pushes erneut mergen)
        if: steps.merge.outputs.merged == 'true'
        id: push
        run: |
          set -uo pipefail
          PUSHED=false
          for attempt in 1 2 3; do
            echo "Push-Versuch $attempt..."
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              PUSHED=true
              break
            fi
            echo "::warning::Push-Versuch $attempt fehlgeschlagen - \`$TARGET_BRANCH\` wurde vermutlich parallel verändert. Erneuter Merge und neuer Versuch."
            if ! git fetch --no-tags origin "$TARGET_BRANCH"; then
              break
            fi
            if ! git merge --no-edit "origin/${TARGET_BRANCH}"; then
              git merge --abort || true
              echo "::error::Erneuter Merge mit origin/$TARGET_BRANCH ist kollidiert."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              echo "### Merge-Konflikt" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$SOURCE_BRANCH\` kollidiert mit einer parallelen Änderung auf \`$TARGET_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          if [ "$PUSHED" = "true" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "### Nach \`$TARGET_BRANCH\` gepusht" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch \`$SOURCE_BRANCH\` ist jetzt in \`$TARGET_BRANCH\` enthalten (kein Pull Request)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "### Push auf \`$TARGET_BRANCH\` abgelehnt" >> "$GITHUB_STEP_SUMMARY"
          echo "Der Merge war lokal erfolgreich, aber der Push wurde abgelehnt." >> "$GITHUB_STEP_SUMMARY"
          echo "Es wurde **kein** Pull Request erstellt - \`$TARGET_BRANCH\` ist unverändert." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Direkter Push auf $TARGET_BRANCH abgelehnt (Branch-Schutz oder fehlende Schreibrechte des Tokens). Es wird KEIN Pull Request erstellt."
          exit 1

      - name: 8) Issue bei Merge-Konflikt erstellen
        if: failure() && steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ env.MERGE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="Auto-Merge-Konflikt: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            echo "Es gibt bereits Issue #$EXISTING - kein neues Issue nötig."
            gh issue comment "$EXISTING" --body "Erneuter Konflikt beim Auto-Merge. Lauf: $RUN_URL" || true
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "$(printf 'Der automatische Merge von `%s` nach `%s` ist an einem Konflikt gescheitert.\\n\\n**Lauf:** %s\\n\\n**Nächste Schritte**\\n\\n1. `%s` lokal auschecken\\n2. Konflikt auflösen und committen\\n3. erneut pushen - der Auto-Merge startet dann automatisch neu\\n' "$SOURCE_BRANCH" "$TARGET_BRANCH" "$RUN_URL" "$SOURCE_BRANCH")" || true

      - name: 9) Issue erstellen, wenn der Push auf main abgelehnt wurde
        if: failure() && steps.push.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ env.MERGE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="Auto-Merge blockiert: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title --jq '.[0].number' || true)"
          BODY="$(printf 'Der Merge von `%s` nach `%s` war lokal erfolgreich, aber der Push wurde von GitHub abgelehnt.\\n\\n**Lauf:** %s\\n\\n**Ursache**\\n\\nBranch-Schutz/Rules auf `%s` oder fehlende Schreibrechte des Tokens.\\n\\n**Lösung**\\n\\n1. Secret `AUTO_MERGE_TOKEN` hinterlegen (Fine-grained PAT, *Contents: Read and write*, bei Branch-Schutz zusätzlich als Bypass eintragen).\\n2. Oder den Branch-Schutz so anpassen, dass GitHub Actions direkt pushen darf.\\n\\nEs wurde bewusst **kein Pull Request** erstellt; `%s` ist unverändert.' "$SOURCE_BRANCH" "$TARGET_BRANCH" "$RUN_URL" "$TARGET_BRANCH" "$TARGET_BRANCH")"
          if [ -n "$EXISTING" ]; then
            echo "Es gibt bereits Issue #$EXISTING - kommentiere statt neu zu erstellen."
            gh issue comment "$EXISTING" --body "$BODY" || true
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY" || true
