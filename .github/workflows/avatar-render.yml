name: Avatar-Render (Glas)

# Auslöser:
#   * Push, sobald sich Configs.toml, Posen.toml, das HDRI oder die Pipeline
#     selbst ändert. Ob wirklich gerendert wird, entscheidet der Schalter
#     "render_bei_aenderung" in der Configs.toml.
#   * Manuell über "Run workflow" (rendert immer, optional mit eigenem Usernamen)
on:
  push:
    paths:
      - "Configs.toml"
      - "Posen.toml"
      - "sunset_jhbcentral_4k.exr"
      - "tools/**"
      - "blender/**"
      - ".github/workflows/avatar-render.yml"
  workflow_dispatch:
    inputs:
      username:
        description: "Roblox-Username (leer lassen = Configs.toml verwenden)"
        required: false
        default: ""
      resolution:
        description: "Auflösung, z. B. 2000x2000 oder 1280x720"
        required: false
        default: "2000x2000"
      samples:
        description: "EEVEE-Samples (Default: 16)"
        required: false
        default: "16"
      debug:
        description: "Debug-Artefakt (manifest.json, summary.md, Blender-Log) auch bei Erfolg hochladen"
        required: false
        default: "false"

# Nur ein Render pro Branch gleichzeitig; neue Pushes brechen den alten Lauf ab.
concurrency:
  group: avatar-render-${{ github.ref }}
  cancel-in-progress: true

# contents: write wird für den "renders"-Branch und das Release gebraucht
# (Bugfix Handy-Download: Artifacts lassen sich in der iOS-App nicht laden).
permissions:
  contents: write

env:
  BLENDER_VERSION: "5.0.1"
  BLENDER_FALLBACK_VERSION: "5.0.0"
  BLENDER_SERIES: "Blender5.0"
  PIPELINE_RESOLUTION: ${{ github.event.inputs.resolution || '2000x2000' }}
  PIPELINE_SAMPLES: ${{ github.event.inputs.samples || '16' }}

jobs:
  # Liest die Configs.toml und entscheidet, ob überhaupt gerendert wird.
  # Der Schalter render_bei_aenderung wird nach einem erfolgreichen Render
  # automatisch wieder auf false gesetzt (letzter Schritt des Render-Jobs).
  config:
    name: Configs.toml lesen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      username: ${{ steps.config.outputs.username }}
      render_jetzt: ${{ steps.config.outputs.render_jetzt }}
    steps:
      - name: 1) Repository auschecken
        uses: actions/checkout@v4

      - name: 2) Configs.toml prüfen und Werte lesen
        id: config
        env:
          INPUT_USERNAME: ${{ github.event.inputs.username }}
        run: |
          set -euo pipefail
          python3 tools/render_config.py --config Configs.toml --github-output >> "$GITHUB_OUTPUT"
          # Manuell eingegebener Username hat Vorrang (letzter Wert gewinnt).
          if [ -n "${INPUT_USERNAME// /}" ]; then
            USERNAME="$(printf '%s' "$INPUT_USERNAME" | tr -d '\r' | head -n 1 | xargs)"
            echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          fi

  render:
    name: Avatar rendern
    needs: config
    # Push: nur wenn render_bei_aenderung = true. Manuell: immer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.config.outputs.render_jetzt == 'true'
    runs-on: ubuntu-latest
    # Ziel: ~10 Minuten gesamt. Frueher 45 - ein haengender Render-Schritt
    # wurde erst dann abgebrochen ("The operation was canceled").
    # Schritt 6 hat sein eigenes, kleineres Budget (siehe dort).
    timeout-minutes: 25

    steps:
      - name: 1) Repository auschecken
        uses: actions/checkout@v4

      - name: 2) Username aus Configs.toml
        id: username
        env:
          CFG_USERNAME: ${{ needs.config.outputs.username }}
          INPUT_USERNAME: ${{ github.event.inputs.username }}
        run: |
          set -euo pipefail
          # workflow_dispatch-Eingabe hat Vorrang, sonst Wert aus der Config.
          RAW="${INPUT_USERNAME:-$CFG_USERNAME}"
          # BOM, Zeilenumbrüche und überflüssige Leerzeichen entfernen
          RAW="${RAW#$'\xef\xbb\xbf'}"
          USERNAME="$(printf '%s' "$RAW" | tr -d '\r' | head -n 1 | xargs || true)"
          if [ -z "$USERNAME" ]; then
            echo "::error file=Configs.toml::Kein Benutzername gefunden. Bitte 'username' in Configs.toml eintragen."
            exit 1
          fi
          # Falls jemand eine Profil-URL eingetragen hat
          if printf '%s' "$USERNAME" | grep -qi 'roblox\.com/users/'; then
            USERNAME="$(printf '%s' "$USERNAME" | sed -E 's#.*roblox\.com/users/([0-9]+).*#\1#')"
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "### Roblox-Username: \`$USERNAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "2b) Roblox-Endpunkte und Key prüfen (Diagnose)"
        continue-on-error: true
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          USERNAME: ${{ steps.username.outputs.username }}
        run: python3 tools/diagnose.py --username "$USERNAME"

      - name: 3) Python-Umgebung prüfen
        run: |
          set -euo pipefail
          python3 --version
          python3 -c "import json, urllib.request; print('Standardbibliothek OK')"
          # Optionale Module fuer komprimierte RBXM-Chunks (Accessoires und
          # Koerperteile kommen als RBXM-Modell, siehe tools/rbxm.py).
          # Faellt die Installation aus, laeuft die Pipeline weiter, aber
          # LZ4-/ZSTD-komprimierte Modelle koennen dann nicht gelesen werden.
          python3 -m pip install --quiet zstandard lz4 \
            || python3 -m pip install --quiet --break-system-packages zstandard lz4 \
            || echo "::warning::zstandard/lz4 konnten nicht installiert werden"
          python3 -c "import zstandard, lz4.block; print('RBXM-Module OK (zstandard, lz4)')" \
            || echo "::warning::zstandard/lz4 nicht verfuegbar - RBXM via zlib-Fallback"
          # DracoPy dekodiert FileMesh-7.00-Meshes (moderne UGC-Items wie
          # das Bricksmith-Badge). Nicht fatal: ohne das Paket werden
          # solche Meshes nur uebersprungen (Begruendung im Manifest).
          # numpy muss mitinstalliert werden: DracoPy importiert es,
          # deklariert es aber nicht als Abhaengigkeit (sonst ImportError).
          python3 -m pip install --quiet DracoPy numpy Pillow \
            || python3 -m pip install --quiet --break-system-packages DracoPy numpy Pillow \
            || echo "::warning::DracoPy/Pillow nicht installierbar - FileMesh 7.00 wird uebersprungen"
          python3 -c "import DracoPy; print('DracoPy OK (FileMesh 7.00)')" \
            || echo "::warning::DracoPy nicht verfuegbar - v7-Meshes werden uebersprungen"

      - name: 4) Avatar laden und Rig bauen
        id: build
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          USERNAME: ${{ steps.username.outputs.username }}
        run: |
          set -uo pipefail
          echo "== Avatar-Daten und Meshes laden =="
          if python3 tools/build_avatar.py --config Configs.toml --username "$USERNAME" --out build; then
            echo "build_mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Live-Download fehlgeschlagen - es wird ein Platzhalter-Körper gerendert."
            echo "build_mode=fallback" >> "$GITHUB_OUTPUT"
            python3 tools/build_avatar.py --config Configs.toml --dry-run --out build
          fi

      - name: 5a) Blender-5.0-Cache wiederherstellen
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: 5) Blender 5.0 installieren
        id: blender
        run: |
          set -euo pipefail
          echo "== Systembibliotheken für Blender 5.0 & Headless EEVEE =="
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers \
            libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgbm1 \
            libxrender1 libxi6 libxxf86vm1 libxfixes3 \
            libsm6 libice6 libxkbcommon0 libx11-6 libxext6 libgomp1 \
            xvfb xz-utils

          if [ -x "$HOME/blender/blender" ] && "$HOME/blender/blender" --version | head -n 1 | grep -q '^Blender 5\.0'; then
            echo "Blender 5.0 aus Cache geladen."
            "$HOME/blender/blender" --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo "bin=$HOME/blender/blender" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -x /usr/local/bin/blender ] && /usr/local/bin/blender --version | head -n 1 | grep -q '^Blender 5\.0'; then
            echo "Blender 5.0 ist bereits im Image vorhanden."
            /usr/local/bin/blender --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo "bin=/usr/local/bin/blender" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "== Blender 5.0 (${BLENDER_VERSION} / Fallback ${BLENDER_FALLBACK_VERSION}) laden =="
          mkdir -p "$HOME/blender"
          DOWNLOADED=0
          TARBALL=""
          for VER in "${BLENDER_VERSION}" "${BLENDER_FALLBACK_VERSION}"; do
            CANDIDATE="blender-${VER}-linux-x64.tar.xz"
            for BASE in \
              "https://download.blender.org/release/${BLENDER_SERIES}" \
              "https://mirror.clarkson.edu/blender/release/${BLENDER_SERIES}" \
              "https://ftp.nluug.nl/pub/graphics/blender/release/${BLENDER_SERIES}"
            do
              echo "Versuche $BASE/$CANDIDATE"
              if curl -fsSL --connect-timeout 15 --retry 2 --retry-delay 2 --max-time 240 --speed-time 30 --speed-limit 10240 \
                   -o "$HOME/blender/$CANDIDATE" "$BASE/$CANDIDATE"; then
                TARBALL="$CANDIDATE"
                DOWNLOADED=1
                break
              fi
            done
            if [ "$DOWNLOADED" -eq 1 ]; then
              break
            fi
          done
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "::error::Blender 5.0 konnte nicht heruntergeladen werden."
            exit 1
          fi

          tar -xf "$HOME/blender/$TARBALL" -C "$HOME/blender" --strip-components=1
          rm -f "$HOME/blender/$TARBALL"
          test -x "$HOME/blender/blender" || { echo "::error::Blender-Binary fehlt"; exit 1; }
          "$HOME/blender/blender" --version | head -n 1 | tee "$HOME/blender/version.txt"
          cat "$HOME/blender/version.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "bin=$HOME/blender/blender" >> "$GITHUB_OUTPUT"

      - name: 6) Glossy-Render mit Blender 5.0 (EEVEE)
        id: render
        # Hartes Limit fuer den ganzen Schritt: frueher liefen bis zu drei
        # komplette Render-Versuche ohne jedes Timeout hintereinander -
        # ein haengender Software-GL-Kontext hat so den Job bis zum
        # 45-Minuten-Job-Timeout blockiert ("The operation was canceled").
        timeout-minutes: 12
        run: |
          set -o pipefail
          BLENDER_BIN="${{ steps.blender.outputs.bin }}"
          echo "== Rendern (EEVEE): ${PIPELINE_RESOLUTION}, ${PIPELINE_SAMPLES} Samples =="
          mkdir -p build/logs
          START=$(date +%s)
          # Gesamtbudget fuer alle Versuche zusammen: 9 Minuten. Jeder
          # Versuch bekommt zusaetzlich sein eigenes Timeout - ein
          # haengender Versuch frisst so nie mehr den ganzen Lauf.
          DEADLINE=$(( START + 540 ))
          RENDER_ARGS=(
            --manifest build/manifest.json
            --out render_avatar.png
            --engine eevee
            --resolution "${PIPELINE_RESOLUTION}"
            --samples "${PIPELINE_SAMPLES}"
            --save-blend build/avatar.blend
          )

          RC=1
          run_attempt() {
            local name="$1" max_s="$2"
            shift 2
            local remaining=$(( DEADLINE - $(date +%s) ))
            if [ "$remaining" -lt 90 ]; then
              echo "::warning::Zeitbudget aufgebraucht - Versuch '$name' wird übersprungen."
              return 1
            fi
            local budget="$max_s"
            [ "$budget" -gt "$remaining" ] && budget="$remaining"
            echo "== Versuch: $name (Timeout ${budget}s, Restbudget ${remaining}s) =="
            rm -f render_avatar.png
            timeout --signal=TERM --kill-after=20s "${budget}s" "$@" \
              2>&1 | tee -a build/logs/blender.log
            local rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::warning::$name wurde nach ${budget}s per Timeout abgebrochen - nächster Versuch."
            fi
            if [ "$rc" -eq 0 ] && [ -s render_avatar.png ]; then
              RC=0
              return 0
            fi
            echo "::warning::$name lieferte Exit $rc bzw. kein Bild."
            return 1
          }

          set +e
          run_attempt "OpenGL (llvmpipe)" 300 \
            env LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_BIN" -b --factory-startup \
              --gpu-backend opengl --python blender/render_glass.py -- "${RENDER_ARGS[@]}" \
          || run_attempt "Vulkan (lavapipe)" 300 \
            "$BLENDER_BIN" -b --factory-startup \
              --gpu-backend vulkan --python blender/render_glass.py -- "${RENDER_ARGS[@]}" \
          || run_attempt "Xvfb + Software-OpenGL" 240 \
            env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" \
              "$BLENDER_BIN" -b --factory-startup --gpu-backend opengl \
              --python blender/render_glass.py -- "${RENDER_ARGS[@]}"
          set -e

          DURATION=$(( $(date +%s) - START ))
          echo "render_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          {
            echo "### Render"
            echo ""
            echo "* Engine: Blender 5.0 EEVEE"
            echo "* Auflösung: ${PIPELINE_RESOLUTION}"
            echo "* Samples: ${PIPELINE_SAMPLES}"
            echo "* World Environment Texture: \`sunset_jhbcentral_4k.exr\`"
            echo "* Material: Principled BSDF (Rauheit 0, Metallic 0.2, IOR Level 1)"
            echo "* Dauer: ${DURATION}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            echo "::error::Blender-Render fehlgeschlagen (Exitcode $RC). Log siehe Artifact 'render-debug'."
            exit "$RC"
          fi
          test -s render_avatar.png || { echo "::error::render_avatar.png wurde nicht erzeugt."; exit 1; }
          ls -lh render_avatar.png

      - name: 7) Ergebnis als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: avatar-render
          path: render_avatar.png
          retention-days: 7
          if-no-files-found: error

      # Artifacts sind session-gebunden und lassen sich in der GitHub-iOS-App
      # nicht herunterladen (about:blank -> App -> 404). Deshalb wird das
      # Bild zusaetzlich an zwei oeffentlich verlinkbaren Stellen abgelegt:
      # im Branch "renders" (Inline-Bild in der Step Summary) und als
      # Release-Asset mit stabiler Download-URL.
      - name: 8) Render im Branch "renders" veröffentlichen (Handy-tauglich)
        env:
          PUSH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ steps.username.outputs.username }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dateiname aus dem Usernamen (nur sichere Zeichen)
          SAFE_NAME="$(printf '%s' "$USERNAME" | tr -cd 'A-Za-z0-9_-' || true)"
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="avatar"; fi

          TMP="$(mktemp -d)"
          # Ergebnis = nur das Bild. Das Manifest bleibt aus dem Branch
          # heraus (keine Analyse-Dateien), wandert aber in die Step Summary.
          cp render_avatar.png "$TMP/latest.png"
          cp render_avatar.png "$TMP/${SAFE_NAME}.png"
          if [ -f build/manifest.json ]; then
            python3 - build/manifest.json >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          audit = (data.get("rig_audit") or {})
          print("\n### Rig-Audit\n")
          spans = audit.get("joint_spans") or {}
          if spans:
              print("| Gelenk | Abstand zum Elterngelenk (Studs) |")
              print("| --- | --- |")
              for key in sorted(spans):
                  print(f"| `{key}` | {spans[key]:.3f} |")
          for note in (audit.get("hinweise") or [])[:20]:
              print(f"* {note}")
          warnings = data.get("warnings") or []
          if warnings:
              print("\n### Warnungen\n")
              for warning in warnings[:20]:
                  print(f"* {warning}")
          PYEOF
          fi

          git -C "$TMP" init -q
          git -C "$TMP" checkout -q --orphan renders
          git -C "$TMP" add -A
          git -C "$TMP" -c user.name="github-actions[bot]" \
                        -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Render: ${SAFE_NAME} (Run ${GITHUB_RUN_ID})"
          git -C "$TMP" push --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" HEAD:renders
          echo "Im Branch 'renders' veroeffentlicht: latest.png + ${SAFE_NAME}.png"

      - name: 9) Release "avatar-render-latest" aktualisieren
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ steps.username.outputs.username }}
        run: |
          set -euo pipefail
          TAG="avatar-render-latest"
          NOTES="Automatisch gerenderter Roblox-Avatar (**${USERNAME}**). Wird bei jedem erfolgreichen Lauf ersetzt – die Download-URL bleibt gleich und funktioniert auch auf dem Handy."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" render_avatar.png --clobber
            # Manifest (Gelenke, Rig-Audit, Warnungen) mitveroeffentlichen -
            # damit laesst sich ein verschobenes Teil auch ohne Artifact
            # nachvollziehen. Der renders-Branch bleibt reines Bild.
            if [ -f build/manifest.json ]; then
              gh release upload "$TAG" build/manifest.json --clobber
            fi
            gh release edit "$TAG" --title "Avatar-Render (aktuell)" --notes "$NOTES"
          else
            gh release create "$TAG" render_avatar.png \
              --title "Avatar-Render (aktuell)" --notes "$NOTES"
            if [ -f build/manifest.json ]; then
              gh release upload "$TAG" build/manifest.json --clobber
            fi
          fi

      - name: 10) Ergebnis in die Step Summary schreiben (nur das Bild)
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            echo "![Render](https://raw.githubusercontent.com/${REPO}/renders/latest.png?v=${GITHUB_RUN_ID})"
            echo ""
            echo "[Bild groß ansehen](https://github.com/${REPO}/blob/renders/latest.png) · "
            echo "[Download](https://github.com/${REPO}/releases/download/avatar-render-latest/render_avatar.png)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 11) Render-Schalter in Configs.toml zurücksetzen
        if: success()
        env:
          PUSH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Nach dem erfolgreichen Render wieder auf false: true ist ein
          # einmaliger "jetzt rendern"-Schalter.
          python3 tools/render_config.py --config Configs.toml --reset-render-flag
          if git diff --quiet -- Configs.toml; then
            echo "render_bei_aenderung war bereits false."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configs.toml
          git commit -q -m "Configs: render_bei_aenderung nach Render zuruecksetzen (Run ${GITHUB_RUN_ID})"
          if ! git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"; then
            echo "::warning::Render-Schalter konnte nicht zurückgesetzt werden (Branch-Schutz?). Bitte render_bei_aenderung manuell auf false setzen."
            exit 0
          fi

      - name: 12) Debug-Daten hochladen (nur bei Problemen oder mit debug=true)
        if: failure() || github.event.inputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: render-debug
          path: |
            build/manifest.json
            build/summary.md
            build/logs/
          retention-days: 7
          if-no-files-found: ignore
