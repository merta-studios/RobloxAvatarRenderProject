name: Tests

# Prüft die Pipeline-Logik (Mesh-Parser, Rig, Manifest, Workflows) ohne Netzwerk
# und ohne Blender. Läuft bei jedem Push (außer `renders`) und bei Pull Requests -
# so wird auch jeder Arena-/Agent-Branch geprüft, der per Auto-Merge nach main geht.
on:
  pull_request:
  push:
    branches-ignore:
      - renders
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        # zstandard/lz4, damit auch die RBXM-Kompressionstests laufen
        run: python -m pip install --upgrade pip pytest PyYAML zstandard lz4 DracoPy numpy

      - name: Tests ausführen
        run: python -m pytest tools/tests -q

      - name: Mesh-Parser gegen echte Roblox-Beispieldateien prüfen
        run: |
          set -euo pipefail
          # Synthetische Meshes aller Versionen werden in den Tests abgedeckt.
          # Hier zusätzlich ein selbst erzeugtes Mesh der Version 2.00:
          python - <<'PY'
          import sys, struct
          sys.path.insert(0, "tools")
          import roblox_mesh

          tris = [(((0, 0, 0), (1, 0, 0), (0, 1, 0)),
                   ((0, 0, -1),) * 3,
                   ((0, 0), (1, 0), (0, 1)))]
          data = bytearray(b"version 2.00\n")
          data += struct.pack("<HBBII", 12, 36, 12, 3, 1)
          for i in range(3):
              data += struct.pack("<8f", *tris[0][0][i], *tris[0][1][i], *tris[0][2][i])
              data += struct.pack("<4b", 0, 0, 127, 127)
          data += struct.pack("<3I", 0, 1, 2)
          mesh = roblox_mesh.parse(bytes(data))
          assert len(mesh.faces) == 1
          print("Mesh-Parser OK")
          PY

      - name: Render-Script syntaktisch prüfen
        run: python -m py_compile blender/render_glass.py tools/*.py
