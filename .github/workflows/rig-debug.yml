name: Rig-Debug-Dump

# Temporärer Debug-Workflow: lädt den kompletten Avatar als Rohdaten
# (RBXMs, Meshes, Texturen) und pusht sie in den Branch `rig-debug-data`,
# damit die Pipeline offline gegen echte Roblox-Daten replizierbar ist.
# Wird nach Abschluss der Rig-Fix-Arbeit wieder entfernt.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rig-debug.yml"
      - ".github/scripts/dump_assets.py"

permissions:
  contents: write

concurrency:
  group: rig-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dump:
    name: Avatar-Rohdaten dumpen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        run: python -m pip install --quiet zstandard lz4 || true

      - name: Rohdaten laden
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/dump_assets.py
          cat debug_dump/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: In Branch "rig-debug-data" pushen
        env:
          PUSH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -r debug_dump "$TMP/"
          git -C "$TMP" init -q
          git -C "$TMP" checkout -q --orphan rig-debug-data
          git -C "$TMP" add -A
          git -C "$TMP" -c user.name="github-actions[bot]" \
                        -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Rig-Debug-Dump (Run ${GITHUB_RUN_ID})"
          git -C "$TMP" push --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" HEAD:rig-debug-data
          echo "Rohdaten im Branch 'rig-debug-data' veroeffentlicht."
