name: Avatar-Dump (Debug)

# Temporärer Debug-Workflow: baut den Avatar und legt den kompletten
# build/-Ordner als ZIP im Branch ab, damit die Pipeline lokal ohne
# Roblox-Zugriff nachvollzogen werden kann (Artifacts sind in dieser
# Umgebung nicht herunterladbar).
on:
  workflow_dispatch:
  push:
    paths:
      - "debugdump/request.txt"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python-Module
        run: |
          python3 -m pip install --quiet --break-system-packages zstandard lz4 DracoPy numpy || true

      - name: Build
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          set -uo pipefail
          USERNAME="$(tr -d '\r' < username.txt | head -n 1 | xargs)"
          python3 tools/build_avatar.py --username "$USERNAME" --out build
          cat build/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          du -sh build || true
          mkdir -p debugdump
          (cd build && zip -q -r ../debugdump/build.zip .)
          ls -lh debugdump

      - name: Dump pushen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debugdump/build.zip
          git commit -q -m "Debug-Dump des Build-Ordners"
          git push origin "HEAD:${GITHUB_REF_NAME}"
