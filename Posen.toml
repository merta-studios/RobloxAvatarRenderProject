# =============================================================================
#  Posen.toml – GFX-Posen für den Avatar-Render
# =============================================================================
#
#  In Configs.toml steht unter "pose" nur noch der Name (oder "None").
#  ALLES andere – Bildausschnitt, Kamera-Abstand, Avatar-Höhe und die
#  Körperhaltung – definiert jede Pose hier selbst.
#
#  Pose-weite Werte (kommen an den Anfang jeder Pose)
#  --------------------------------------------------
#      sichtbar_oben_prozent   Freier Platz über der Kopfoberkante in % der
#                              Bildhöhe. Negativ = Kopf ragt oben raus.
#      sichtbar_unten_prozent  Freier Platz unter den Füßen in %.
#                              Negativ schneidet an: -35 zeigt z. B. nur
#                              etwa ab der Hüfte aufwärts (Bust-/GFX-Schnitt).
#                              Oben + unten müssen zusammen unter 95 bleiben.
#      kamera_abstand_studs    Zusätzlicher Abstand der Kamera in Studs:
#                              0 = exakt passend zu den sichtbar_*-Werten,
#                              +2 = weiter weg (Avatar kleiner, mehr Luft),
#                              -1 = näher dran (größer, dramatischer).
#      avatar_hoch_studs       Ganzen Avatar anheben (+) oder absenken (-),
#                              z. B. für Sprünge (+) oder Landungen (-).
#
#  Körperteile – nur Delta-Werte zur Stand-Pose
#  --------------------------------------------
#  Keine exakten Positionen/Rotationen mehr! Jeder Wert sagt, wie sich das
#  Gelenk gegenüber der Stand-Pose WEITER verändert. Nicht genannte Teile
#  und Felder bleiben neutral (0). Drehung immer um das echte Gelenk
#  (Schulter, Ellbogen, Hüfte, Knie … aus den RigAttachments des Avatars).
#
#      Oberer/unterer Torso, Kopf:
#          nach_vorne_beugen_grad / nicken_grad (Kopf)  + = nach vorn
#          nach_links_drehen_grad                      + = Blick nach links
#          nach_rechts_neigen_grad                     + = zur rechten Seite
#          hoch_studs / vor_studs / nach_rechts_studs  Positions-Delta
#
#      Oberarm / Oberbein:
#          vor_hoch_schwingen_grad   0 = hängt, 90 = waagerecht vorn, 180 = oben
#          vom_koerper_weg_grad      + = seitlich vom Körper weg (beide Seiten!)
#          laengs_drehung_grad       Drehung um die eigene Glied-Achse
#
#      Unterarm:  ellbogen_beugen_grad (+ = Unterarm klappt nach vorn)
#      Hand:      handgelenk_vor_beugen_grad, handgelenk_nach_aussen_grad
#      Unterbein: knie_beugen_grad (+ = Unterschenkel klappt nach hinten)
#      Fuß:       spitze_senken_grad, fuss_nach_aussen_drehen_grad
#
#      Alle Glieder außerdem: hoch_studs, vor_studs,
#      seitlich_nach_aussen_studs (kleine Positions-Deltas, max. ±2 Studs).
#
#  Erlaubte Körperteile: oberer_torso, unterer_torso, kopf,
#  linker_oberarm, linker_unterarm, linke_hand, rechter_oberarm,
#  rechter_unterarm, rechte_hand, linkes_oberbein, linkes_unterbein,
#  linker_fuss, rechtes_oberbein, rechtes_unterbein, rechter_fuss.
#
#  Accessoires folgen automatisch ihrem Körperteil (Hut -> Kopf,
#  Halskette -> Torso …). Ausrüstung (Gear) wird nie mit geladen.
# =============================================================================


