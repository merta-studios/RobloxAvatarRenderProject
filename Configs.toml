# =============================================================================
#  Configs.toml – alle Einstellungen für den Avatar-Render
# =============================================================================
#
#  Diese Datei ersetzt die frühere username.txt. Werte ändern, committen,
#  pushen – der Workflow „Avatar-Render (Glas)“ erledigt den Rest.
#
#  Kleine Schreibhilfe:
#    * Texte stehen in "Anführungszeichen" – z. B. "MertaStudios".
#    * Schalter sind true oder false (ohne Anführungszeichen).
#    * Zahlen stehen ohne Anführungszeichen – z. B. 6, -40 oder -12.5.
#    * Alles nach einem # ist Kommentar und wird ignoriert.
#
#  Geprüft werden die Werte automatisch (tools/render_config.py): falsche
#  Werte (z. B. 120 Grad Drehung) führen zu einer klaren Fehlermeldung,
#  statt einen kaputten Render zu erzeugen.
# =============================================================================


# -----------------------------------------------------------------------------
#  1) Roblox-Benutzername
# -----------------------------------------------------------------------------
#  Der Name aus der Roblox-Profil-URL, z. B. "MertaStudios".
#  (Ein "https://www.roblox.com/users/123456/profile"-Link funktioniert auch.)
username = "Djselena2013"


# -----------------------------------------------------------------------------
#  2) Seitliche Drehung des Avatars
# -----------------------------------------------------------------------------
#  In Grad. Der Avatar wird für die Aufnahme seitlich gedreht (die Kamera
#  kreist dafür um ihn herum):
#      0    = frontal zur Kamera (direkt zur Mitte)
#      90   = nach rechts gedreht  -> wir sehen die rechte Seite (Profil)
#      -90   = nach links gedreht  -> wir sehen die linke Seite (Profil)
#  Erlaubt ist nur -90 bis 90. Zwischenwerte wie 25 oder -40 sind ideal für
#  eine schräge 3/4-Ansicht (früher war der Render fest auf ca. 27°).
drehung_grad = 0


# -----------------------------------------------------------------------------
#  3) Pose
# -----------------------------------------------------------------------------
#  Drei Möglichkeiten:
#
#  a) "None"                      normale Stand-Pose (wie bisher).
#
#  b) Name einer Pose aus Posen.toml, z. B. "Helden_Pose", "Siegerfaust",
#     "Kampfstellung", "Superhelden_Landung" oder "Winken". Jede Pose bringt
#     ihren eigenen Bildausschnitt (sichtbar oben/unten), Kamera-Abstand und
#     ihre Körperhaltung mit. Accessoires folgen automatisch (Ausrüstung/Gear
#     wird nie mit geladen).
#
#  c) Emote aus dem Roblox-Katalog: einfach die Emote-Asset-ID angeben –
#     z. B. die Zahl aus der Katalog-URL
#     https://www.roblox.com/catalog/3576893107/Tilt
#
#         pose = "emote:3576893107"
#
#     Die Pipeline lädt das Emote und wendet genau die Haltung an, die auch
#     das Katalog-Vorschaubild zeigt – deterministisch über die Daten, die
#     Roblox selbst dafür im Emote-Asset ablegt (ThumbnailKeyframe bzw.
#     ThumbnailTime). Ohne diese Werte gilt Roblox' eigene Regel:
#     der MITTLERE KEYFRAME – bei CurveAnimations zunächst der mittlere
#     benannte Keyframe (die Namen der ursprünglichen Keyframes reisen
#     als MarkerCurve "NamedKeyframeEvent" im Asset mit), und wenn das
#     Emote gar keine benannten Keyframes hat (wie viele UGC-Tänze),
#     der mittlere Keyframe der aus den Kanal-Keys generierten
#     KeyframeSequence (exakt die Zeiten, an denen Roblox' Konverter
#     Keyframes setzt); bei klassischen Emotes der Mittel-Keyframe;
#     nur ohne jede Keyframe-Info die halbe Emote-Dauer. Moderne
#     UGC-Emotes (CurveAnimations) werden genauso unterstützt wie
#     klassische KeyframeSequence-Emotes.
#
#     Optional dazu (siehe auch 3b/3c unten):
#         emote_zeit  = Zeitpunkt in Sekunden, falls ein anderer Frame als
#                       der Vorschau-Frame gewünscht ist (-1 = automatisch
#                       nach der Vorschau-Regel).
#         emote_datei = Pfad zu einer lokalen Emote-Datei (.rbxm/.rbxmx),
#                       statt sie über die Asset-ID herunterzuladen.
#
#     Schlägt das Laden fehl (falsche ID, Netzwerk), wird automatisch die
#     Stand-Pose gerendert und eine Warnung ins Log geschrieben.
pose = "emote:4272351660"


# -----------------------------------------------------------------------------
#  3b) Emote: Frame-Auswahl (optional)
# -----------------------------------------------------------------------------
#  Nur relevant, wenn unter "pose" ein Emote (emote:…) steht.
#      -1  = automatisch: exakt der Frame aus dem Katalog-Vorschaubild
#            (ThumbnailKeyframe/ThumbnailTime aus dem Emote-Asset, sonst
#            Roblox' Fallback Mittel-Keyframe/halbe Dauer). Default.
#      >= 0 = expliziter Zeitpunkt in Sekunden; bei KeyframeSequence-Emotes
#            wird der Keyframe genommen, der diesem Zeitpunkt am nächsten
#            liegt. So lässt sich z. B. die "ausdrucksstärkste" Haltung
#            eines Tanz-Emotes einfrieren.
emote_zeit = 0.0


# -----------------------------------------------------------------------------
#  3c) Emote: lokale Datei statt Download (optional)
# -----------------------------------------------------------------------------
#  Leer ("") = Emote über die Asset-ID aus dem Internet laden (Normalfall).
#  Sonst ein Pfad zu einer gespeicherten Emote-Datei (.rbxm oder .rbxmx),
#  relativ zum Repository-Root oder absolut. Praktisch zum Testen ohne
#  Netzwerk oder für private Emotes.
emote_datei = ""


# -----------------------------------------------------------------------------
#  4) Bildausschnitt, Kamera-Abstand und Avatar-Höhe
# -----------------------------------------------------------------------------
#  Diese Werte stehen NICHT mehr hier, sondern in jeder Pose in Posen.toml
#  selbst (sichtbar_oben_prozent, sichtbar_unten_prozent,
#  kamera_abstand_studs, avatar_hoch_studs). Dort steht in den Kommentaren
#  zu jeder Pose, bis zu welchen Positionen man im Bild sehen kann
#  (z. B. ganzer Körper, nur Oberkörper oder mit viel Luft für einen Sprung).
#  Wer einen anderen Ausschnitt will, ändert also die Pose – oder legt in
#  Posen.toml eine eigene Pose mit anderen Werten an.


# -----------------------------------------------------------------------------
#  5) Render nach dem Veröffentlichen starten?
# -----------------------------------------------------------------------------
#  true  = der Workflow rendert nach diesem Push sofort ein neues Bild.
#  false = nur speichern/veröffentlichen, kein Render.
#
#  Wichtig: Der Workflow setzt diesen Schalter nach einem erfolgreichen Render
#  automatisch wieder auf false. So rendert es nicht bei jeder kleinen
#  Änderung erneut – einfach auf true stellen, wenn ein neues Bild gewünscht
#  ist.
render_bei_aenderung = false


# -----------------------------------------------------------------------------
#  6) Hintergrundbild
# -----------------------------------------------------------------------------
#  URL zu einem Bild (PNG/JPG/WEBP/BMP), das in Blender auf eine Fläche
#  gelegt wird. Die Fläche sitzt exakt hinter dem Avatar und ist genau so
#  groß, dass sie bis zum Bildrand reicht.
#
#  Sonderwerte:
#      "hdri"        -> wie bisher: die HDRI-Umgebung
#                       (sunset_jhbcentral_4k.exr) ist der Hintergrund
#      "transparent" -> kein Hintergrundbild, das Bild wird durchsichtig
#                       (PNG mit Alpha)
#
#  Beispiele:
#      hintergrund_url = "https://example.com/wallpaper.jpg"
#      hintergrund_url = "hdri"
#      hintergrund_url = "hdri"
#
#  Kann das Bild nicht geladen werden (404, kein Netz), rendert die Pipeline
#  trotzdem weiter und benutzt das HDRI als Hintergrund.
hintergrund_url = "transparent"


# -----------------------------------------------------------------------------
#  7) Hintergrund: glänzend oder matt?
# -----------------------------------------------------------------------------
#  true  = der Hintergrund glänzt genau wie der Avatar (glossy: Rauheit 0,
#          Metallic 0,2, Specular 1 – also mit Spiegelungen des HDRI).
#  false = der Hintergrund ist matt (hohe Rauheit, kaum Spiegelung), damit
#          das Bild ruhig und gut lesbar bleibt.
hintergrund_glossy = false


# -----------------------------------------------------------------------------
#  8) Layered Clothing (Kleidung, die sich im Spiel eng an den Körper schmiegt)
# -----------------------------------------------------------------------------
#  Roblox verformt solche Kleidung im Client über eine Cage-Deformation –
#  genauso kann sie offline nicht nachgebaut werden. Sie würde daher in
#  Posen starr am Körper kleben bleiben und nicht mit den Armen/Beinen
#  mitgehen. Zwei Möglichkeiten:
#
#      "auslassen"  = Layered Clothing wird GAR NICHT gerendert (Default).
#                     Der Körper selbst bleibt vollständig sichtbar.
#      "starr"      = Layered Clothing wird mitgerendert, dreht aber nur
#                     starr mit seinem Anker-Knochen mit (alter Zustand –
#                     bei Posen können Ärmel/Schöße dann falsch stehen).
layered_clothing = "auslassen"
